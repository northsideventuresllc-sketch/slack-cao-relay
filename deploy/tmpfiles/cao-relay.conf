# /etc/tmpfiles.d/cao-relay.conf — runtime directories for the four relay programs.
# Control sockets: /run/cao-relay/<cao>/control.sock (0660, group cao-relay-admin).
d /run/cao-relay                  0755 root                  root            -
d /run/cao-relay/muse             0750 cao-relay-muse        cao-relay-admin -
d /run/cao-relay/claude           0750 cao-relay-claude      cao-relay-admin -
d /run/cao-relay/gemini           0750 cao-relay-gemini      cao-relay-admin -
d /run/cao-relay/axon             0750 cao-relay-axon        cao-relay-admin -
